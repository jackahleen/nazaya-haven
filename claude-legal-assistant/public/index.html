<!DOCTYPE html>
<html>
<head>
    <style>

body {
  font-family: "Lucida Handwriting", cursive;
  max-width: 800px;
  margin: 40px auto;
  background: #fff8fc;
}

h1 {
  text-align: center;
  color: #8f6ed5;
}

/* 👇 CHAT STYLES (PASTE HERE) */
#chat {
  height: 500px;
  overflow-y: auto;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 20px;
  background: #faf8ff;
}

.user {
  background: #ffb6d9;
  color: black;
  padding: 12px 16px;
  border-radius: 20px;
  max-width: 75%;
  margin: 10px 0 10px auto;
  width: fit-content;
  text-align: left;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.ai {
  background: #d8c4ff;
  color: black;
  padding: 12px 16px;
  border-radius: 20px;
  max-width: 75%;
  margin: 10px auto 10px 0;
  width: fit-content;
  text-align: left;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.quick-actions {
  margin: 20px 0;
}

.quick-actions button {
  background: linear-gradient(135deg, #ffb6d9, #d8c4ff);
  color: black;
  border: none;
  border-radius: 25px;
  padding: 10px 15px;
  margin: 5px;
  cursor: pointer;
  font-family: "Times New Roman", serif;
}
.quick-actions button:hover {
  background: #7050e6;
}

input {
  width: 75%;
  padding: 14px;
  border-radius: 25px;
  border: 1px solid #ccc;
  font-size: 16px;
  font-family: "Times New Roman", serif;
}

button {
  padding: 14px 20px;
  border-radius: 25px;
  border: none;
  background: #caa7ff;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #b38cff;
}

</style>
</head>
<body>

  <h1>🤖 Nazaya AI</h1>

<div id="chat"></div>

<input id="question" placeholder="Ask a question..." />
<button onclick="askAI()">Send</button>

<div class="quick-actions">

<button onclick="fillQuestion('What are my tenant rights in California?')">
⚖️ Legal Help
</button>

<button onclick="fillQuestion('I feel overwhelmed and need grounding techniques.')">
🌿 Grounding
</button>

<button onclick="fillQuestion('Help me understand my emotions.')">
🧠 Emotional Awareness
</button>

<button onclick="fillQuestion('Can you recommend therapy resources?')">
💜 Therapy Resources
</button>

<button onclick="fillQuestion('Teach me emotional intelligence skills.')">
❤️ Emotional Intelligence
</button>

</div>

<script>

function fillQuestion(text) {
  document.getElementById("question").value = text;
}

async function askAI() {
  const question = document.getElementById("question").value;

  addMessage("user", question);

  const res = await fetch("/ask", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ question })
  });

  const data = await res.json();

  addMessage("ai", formatLegalText(data.answer));

  document.getElementById("question").value = "";
}

function addMessage(role, text) {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = role;
  div.innerHTML = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function formatLegalText(text) {
  return text
    .replace(/^#+\s*/gm, "")
    .replace(/\*\*(.*?)\*\*/g, "$1")
    .replace(/^\d+\.\s(.*$)/gm, "<li>$1</li>")
    .replace(/(<li>[\s\S]*<\/li>)/g, "<ol>$1</ol>")
    .replace(/\n/g, "<br>");
}

</script>

</body>
</html>
