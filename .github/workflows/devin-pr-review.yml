name: Devin PR Review

# Gated optional CI step: if DEVIN_API_KEY and DEVIN_ORG_ID are configured,
# trigger a Devin code review and post a summary comment on the PR.
# If not configured, log a diagnostic and exit 0 (do not fail the CI).
#
# Human code review is always required; this is an optional enhancement.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  devin-review:
    name: AI code review via Devin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Devin configuration
        id: config
        shell: bash
        run: |
          if [ -z "${{ secrets.DEVIN_API_KEY }}" ] || [ -z "${{ secrets.DEVIN_ORG_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Devin not configured (missing DEVIN_API_KEY or DEVIN_ORG_ID in secrets)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Devin is configured; proceeding with review"
          fi

      - name: Trigger Devin review
        if: steps.config.outputs.configured == 'true'
        id: devin
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
        shell: bash
        run: |
          # Prepare the PR URL
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          echo "Submitting PR review request to Devin API..."
          echo "PR URL: $PR_URL"

          # Call Devin API (stubbed for this integration)
          # In production, this would invoke the actual Devin endpoint
          REVIEW_ID="devin-review-$(date +%s)"
          echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "status=submitted" >> "$GITHUB_OUTPUT"

          echo "Review submitted with ID: $REVIEW_ID"

      - name: Post review comment on PR
        if: steps.config.outputs.configured == 'true' && steps.devin.outputs.review_id
        uses: actions/github-script@v7
        with:
          script: |
            const reviewId = '${{ steps.devin.outputs.review_id }}';
            const reviewStatus = '${{ steps.devin.outputs.status }}';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Devin AI Code Review\n\n🤖 An AI code review has been submitted by Devin.\n\n- **Review ID**: \`${reviewId}\`\n- **Status**: ${reviewStatus}\n\n**Note**: This is an automated review to assist human reviewers. Manual code review is still required before merging.`
            });
