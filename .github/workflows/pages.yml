name: Publish Static Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-preview
  cancel-in-progress: true

jobs:
  build:
    name: Build static preview
    runs-on: ubuntu-latest

    env:
      GH_PAGES_DEPLOY_TOKEN: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set repository Pages base path
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO_NAME" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify Pages static export
        run: npm run verify:pages

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload static preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: nazaya-haven-static-preview
          path: out
          if-no-files-found: error

      - name: Publish gh-pages branch
        if: ${{ env.GH_PAGES_DEPLOY_TOKEN != '' }}
        env:
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          git -C out init
          git -C out config user.name "github-actions[bot]"
          git -C out config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C out checkout -b gh-pages
          git -C out add .
          git -C out commit -m "deploy static preview"
          git -C out push --force "https://x-access-token:${GH_PAGES_DEPLOY_TOKEN}@github.com/${REPO}.git" gh-pages

      - name: Explain skipped gh-pages publish
        if: ${{ env.GH_PAGES_DEPLOY_TOKEN == '' }}
        run: |
          echo "GH_PAGES_DEPLOY_TOKEN is not configured, so this run only uploaded the static preview artifact."
          echo "The gh-pages branch can still be updated manually from a local static export."
