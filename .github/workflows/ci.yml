name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "superpowers/**"
      - "cursor/**"
      - "feat/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify static app
        run: npm run verify:static

      - name: Verify hosted build
        run: npm run verify:hosted

      - name: Run hosted API proofs
        run: npm run test:hosted-api

      - name: Upload Playwright proof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-proofs
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
